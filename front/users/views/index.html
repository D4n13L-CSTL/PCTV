<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Propiedad Industrial / Derechos de Autor - Plataforma Integral</title>
  <!-- Tailwind CSS + Font Awesome + Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #f4f7fc; }
    .card-hover:hover { transform: translateY(-2px); transition: all 0.2s ease; box-shadow: 0 12px 20px -12px rgba(0,0,0,0.15); }
    .transition-smooth { transition: all 0.2s ease; }
    /* Custom scroll */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-gray-100">

  <div id="app" class="max-w-7xl mx-auto px-4 py-6 md:py-8">
    <!-- Header + Navigation Tabs -->
    <div class="flex flex-wrap justify-between items-center mb-6 border-b border-gray-200 pb-4">
      <div class="flex items-center gap-3">
        <i class="fas fa-gavel text-indigo-700 text-3xl"></i>
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Registro<span class="text-indigo-600">IP</span></h1>
        <span class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-2 py-0.5 rounded-full">SAPI+Venezuela</span>
      </div>
      <div class="flex gap-2 mt-2 sm:mt-0 flex-wrap">
        <button data-tab="new" class="tab-btn px-4 py-2 rounded-lg font-medium transition-smooth bg-indigo-600 text-white shadow-sm"><i class="fas fa-plus-circle mr-1"></i> Nueva solicitud</button>
        <button data-tab="dashboard" class="tab-btn px-4 py-2 rounded-lg font-medium text-gray-700 hover:bg-gray-200"><i class="fas fa-chart-line mr-1"></i> Dashboard</button>
        <button data-tab="payments" class="tab-btn px-4 py-2 rounded-lg font-medium text-gray-700 hover:bg-gray-200"><i class="fas fa-credit-card mr-1"></i> Pagos</button>
        <button data-tab="profile" class="tab-btn px-4 py-2 rounded-lg font-medium text-gray-700 hover:bg-gray-200"><i class="fas fa-user-circle mr-1"></i> Perfil</button>
        <button data-tab="logout" class="tab-btn px-4 py-2 rounded-lg font-medium text-gray-700 hover:bg-gray-200"><i class="fas fa-sign-out-alt mr-1"></i> Salir</button>      
      </div>
    </div>

    <!-- CONTENEDOR DINÁMICO DE VISTAS -->
    <div id="viewContainer" class="bg-white rounded-2xl shadow-xl p-5 md:p-7 transition-all"></div>
  </div>

<script src="../static/JS/script.js"></script>
</body>
</html>
